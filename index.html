<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>photofilm</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0e0e10; height: 100%; width: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    color: #e8e6e1;
  }
  img, canvas { user-select: none; }
  #root { height: 100%; }
</style>

<!-- React + Babel (in-browser JSX compiler for live editing of the .jsx files) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Source files. Order matters: pipeline exposes globals consumed by tabs
     and the app shell; tabs must load before app.jsx references them. -->
<script type="text/babel" src="pipeline.jsx"></script>
<script type="text/babel" src="tabs.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
const TWEAKS = {
  accent:     "#b8341f",  // fuji red
  fontFamily: "'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace",
  density:    "regular",
  railSide:   "right",
  thumbSize:  96,
  histogram:  true,
};

ReactDOM.createRoot(document.getElementById('root')).render(<PhotofilmRoot tweaks={TWEAKS} />);
</script>
<script data-goatcounter="https://divyashivaram.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
